name: 📺 Live TV Channels Sync Engine

on:
  schedule:
    # প্রতি ১২ ঘণ্টা পর পর স্বয়ংক্রিয়ভাবে রান হবে (UTC)
    - cron: '0 */12 * * *'
  workflow_dispatch: # গিটহাব থেকে ম্যানুয়ালি বাটনে চাপ দিয়ে রান করার সুবিধা

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-channels:
    name: 🚀 Fetch & Update Channel Data
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📥 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests rich

      - name: ⚡ Execute Channel Fetcher Script
        env:
          API_URL: ${{ secrets.API_URL }}
        run: python fetch_channels.py

      - name: 🔄 Commit & Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add channels.json
          
          # শুধুমাত্র পরিবর্তন থাকলেই কেবল গিটহাবে Commit করবে
          if git diff --staged --quiet; then
            echo "::notice ::No changes detected in channels data. Skipping commit."
          else
            git commit -m "chore(data): 📺 auto-update channels.json [skip ci]"
            git push
            echo "::notice ::Successfully updated channels.json in repository!"
          fi
